name: Verify workbench
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python integration tests (fixture CLI, no API key)
        run: python3 -B -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check static/app.js
      - name: Build real Codex container
        run: docker build -t agent-desk .
      - name: Smoke test container, non-root user and persistence
        run: |
          docker run -d --name desk -p 127.0.0.1:8080:8080 -v desk-data:/data agent-desk
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8080/health
          test "$(docker exec desk id -u)" != "0"
          docker exec desk codex --version
          ID=$(curl -fsS -X POST -H 'Content-Type: application/json' --data '{"title":"Container persistence"}' http://127.0.0.1:8080/api/sessions | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          docker restart desk
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health && break || sleep 1; done
          curl -fsS "http://127.0.0.1:8080/api/sessions/$ID" | python3 -c 'import json,sys; assert json.load(sys.stdin)["title"]=="Container persistence"'
          docker logs desk
      - name: Container logs on failure
        if: failure()
        run: docker logs desk || true
