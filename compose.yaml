services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      DATA_DIR: /data
      RUN_IN_CONTAINER: "1"
    volumes:
      - workspace-data:/data
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
volumes:
  workspace-data:
